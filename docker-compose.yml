# One command for the whole stack (db + backend + frontend):
#   docker compose up --build
# Frontend -> http://localhost:5173 | Backend -> http://localhost:8091 | DB -> localhost:5432
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: GestorDeLogistica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d GestorDeLogistica"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8091:8091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/GestorDeLogistica
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1234"
      JWT_SECRET: "Zg8rV3nQ2xLp9WmY7tKcJ4hB6uD1sA0eR5oI8yF3nX2vC1qZ9pL7wK4mT6bH0jU3s"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
